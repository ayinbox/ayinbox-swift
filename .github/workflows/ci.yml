name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: swift ${{ matrix.swift }} on Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.9", "5.10", "6.0"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
